[package]
name = "qwreey-proc-guard"
version = "0.1.0"
description = "qwreey-proc-guard plugin hooks (heavy-proc-guard, self-match-guard, resource-guard) as one binary"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qwreey-proc-guard"
path = "src/main.rs"

[dependencies]
harness-hook = { path = "../harness-hook" }
serde_json = { workspace = true }
sha2 = { workspace = true }

# statvfs(디스크 여유), flock(세션 기록 잠금), getuid(상태 폴더 소유자). std 에 없고 unsafe 는 금지라 쓴다(Q41).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[lints]
workspace = true
