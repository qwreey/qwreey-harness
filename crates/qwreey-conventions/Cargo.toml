[package]
name = "qwreey-conventions"
version = "0.1.0"
description = "qwreey-conventions plugin hooks (conventions-check, reuse-check, structure-reminder, memory-placement, rules-inject, bash-bypass-reminder, bash-writes) as one binary"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qwreey-conventions"
path = "src/main.rs"

[dependencies]
harness-hook = { path = "../harness-hook" }
# reuse-check 색인 이름과 그림자 기록 id(python hashlib.sha1 의 앞 12자). 두 판이 같은 색인 파일을 나눠 쓴다.
sha1 = { workspace = true }

# 상태 파일 잠금(conventions-check 의 state_lock, python fcntl.flock). std 에 없고 unsafe 는 금지라 쓴다(Q41).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
# git 에 이 훅이 물려받은 fd(>2)를 넘기지 않는다(python subprocess 의 close_fds=True).
close_fds = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
