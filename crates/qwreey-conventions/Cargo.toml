[package]
name = "qwreey-conventions"
version = "0.1.0"
description = "qwreey-conventions plugin hooks (conventions-check, reuse-check, structure-reminder, memory-placement) as one binary"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qwreey-conventions"
path = "src/main.rs"

[dependencies]
harness-hook = { path = "../harness-hook" }
# harness-hook 의 regex 에 지연 DFA 를 켠다(이 crate 만): 큰 파일(3.3k 줄)에서 conventions-check 가 이것 없이 약 50 ms, 있으면 약 11 ms 다.
# 훅마다 짧은 글만 보는 proc-guard, sessions 는 켜도 이득이 없어 따로 빌드한다(크기 +124 KB).
regex = { workspace = true, features = ["perf-dfa"] }
# reuse-check 색인 이름과 그림자 기록 id(python hashlib.sha1 의 앞 12자). 두 판이 같은 색인 파일을 나눠 쓴다.
sha1 = { workspace = true }

# 상태 파일 잠금(conventions-check 의 state_lock, python fcntl.flock). std 에 없고 unsafe 는 금지라 쓴다(Q41).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[lints]
workspace = true
