# taxonomy.toml — luau-kb 분류 어휘 (초안, 2026-11-10)
#
# 상태: 초안. luau-kb 에는 아직 쓰지 않는다. 형식과 규칙은 coderag tech-design.md §16.
# 도출 근거: luau-kb 의 스킬·references 구조(2026-11-10 시점)와 snippets/·bench/ 파일 이름.
#   각 범주 옆 주석 `← …` 은 지금 그 범주에 들어갈 파일·절이다(검토용, 형식의 일부 아님).
#   luau-perf·luau-style·luau-testing·luau-upstream 은 다른 에이전트가 만드는 중이라 그 시점의 목차로 적었다.
#
# 규칙 요약 (§16)
#   - 키는 범주의 정규 경로. 조각은 [a-z0-9-], 구분은 "/". 부모는 자식 선언으로 암묵 선언된다.
#   - label: 사람이 읽는 이름(채널 A 의 묶음 제목). aliases: 검색 동의어(낱말). 입력 정규화에는 쓰지 않는다.
#   - skill: 이 범주의 1차 진입 스킬(정보용). review_days: review_after 가 없을 때 last_verified + N 일.
#   - deprecated = "<새 경로>": 폐기. 색인 때 새 경로로 바꿔 저장하고 lint 가 경고한다. 항목은 지우지 않는다.
#   - planned = true: 아직 문서가 없는 범주(원천에도 정리본 없음). lint 가 "빈 범주"로 세지 않는다.

schema = 1
pack = "luau-kb"
# 이 pack 이 소유하는 최상위. harness 는 luau-kb 가 아니라 global(claude-doctor) 어휘 후보 — 결정 D13-6·D16-5.
roots = ["luau", "roblox", "harness"]

[defaults]
review_days = 90

