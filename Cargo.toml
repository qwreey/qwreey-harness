# 플러그인 훅의 Rust 백엔드(.claude/plan/rust-hook-backend.md). 공통 crate 하나와, 플러그인마다 바이너리를 내는 crate 를 둔다.
# 공통 코드는 컴파일 때만 공유하고, 설치된 바이너리끼리는 서로 기대지 않는다.
[workspace]
members = ["crates/*"]
# edition 2024 의 기본값. 의존성을 고를 때 rust-version 을 본다.
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# 의존성은 여기서만 판을 정하고, crate 는 `workspace = true` 로 가져온다.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
# 같은 RustCrypto 계열(digest 0.11 을 sha2 와 같이 쓴다). reuse-check 색인 파일 이름과 그림자 기록 id 가 python hashlib.sha1 과 같아야 한다.
sha1 = { version = "0.11.0", default-features = false }
getrandom = "0.4.3"
rustix = { version = "1.1.6", features = ["process", "fs"] }
# 띄우는 워커에 물려줄 fd 를 close-on-exec 로(python subprocess 의 close_fds=True). 날 fd 번호로 fcntl 을 부르는 safe API 가
# rustix 에도 std 에도 없다(BorrowedFd::borrow_raw 는 unsafe). 새로 드는 crate 는 이것 하나다(libc, cfg-if 는 이미 있다).
close_fds = "0.3.2"
# 이 기기 시간대의 오늘 날짜(python date.today, localtime). TZ 와 tzdb 규칙을 직접 짜지 않으려고 쓴다(qwreey-sessions).
jiff = { version = "0.2.43", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
# 소스에 글로 적힌 고정 정규식(Q48 a). python 과 뜻이 갈릴 수 있는 글(일부 Unicode 글자, 끝 줄바꿈)은 harness-hook 의 rx 가
# py::re 로 넘기므로 판정은 python 과 같다. 사용자가 적는 패턴(pgrep -f, 설정 파일)은 python 이 물러날 때까지 py::re 다.
# unicode-perl(\w \s \d \b), unicode-case((?i)), unicode-gencat(\p{L} \p{N}). perf 중 perf-dfa(지연 DFA)만 모든 crate 에 켠다(Q50 a):
# 큰 파일(3.3k 줄)에서 conventions-check 가 이것 없이 약 50 ms, 있으면 약 11 ms 다. 짧은 글만 보는 훅은 이득도 손해도 없고
# 바이너리마다 약 124 KB 커진다. crate 마다 기능이 같으니 어느 묶음으로 빌드해도 바이너리가 같다.
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "perf-dfa"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# 훅은 도구 호출마다 새로 뜬다. lto, codegen-units=1, strip, panic=abort 로 크기와 시작 비용을 줄인다.
# opt-level 3: smoke 예제(stdin, 설정 층, PATH 찾기, deny) 실측에서 한 번 띄우는 CPU 는 3, 2, s, z 모두 0.54~0.58 ms 로
# 측정 잡음 안이었고(/bin/true 0.31 ms), 크기는 3 이 536 KB, s 가 485 KB, z 가 480 KB 다. 시작 비용 차이가 없으니
# 크기 50 KB 보다 뒤에 올 계산 많은 훅(qwreey-conventions 의 렉서)의 속도를 택했다. 다시 재는 법은 examples/smoke.rs.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
