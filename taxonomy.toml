# taxonomy.toml — luau-kb 분류 어휘 (coderag pack 어휘, 형식은 coderag tech-design §16)
#
# 정본: 이 파일. 초안은 claude-doctor drafts/coderag/taxonomy.toml(2026-11-10)이었고, M6 에서 실제 references 에 맞춰 다듬었다.
#   - 범주는 파일 하나에 하나(D16-2). references 의 frontmatter `category:` 가 여기 경로를 쓴다.
#   - 초안의 절 단위 범주(예: too complex 한도, DX, 보안, 원격·복제 세분)는 그 절을 담은 파일의 범주로 합치고 별칭을 옮겼다.
#   - `harness/*` 는 luau-kb 의 지식이 아니라 빼고, claude-doctor(global 계층) 어휘 후보로 초안에 남겼다(D13-6).
#
# 규칙 요약 (§16)
#   - 키는 범주의 정규 경로. 조각은 [a-z0-9-], 구분은 "/". 부모는 자식 선언으로 암묵 선언된다.
#   - label: 사람이 읽는 이름. aliases: 검색 동의어(질의 낱말이 모두 맞으면 그 범주와 하위 문서에 가중치 4). 입력 정규화에는 쓰지 않는다.
#   - skill: 이 범주의 1차 진입 스킬(정보용). review_days: review_after 가 없을 때 last_verified + N 일.
#   - deprecated = "<새 경로>": 폐기(조회 때 새 경로로 바꿈). 항목은 지우지 않는다. planned = true: 아직 문서가 없는 범주.
#   - 각 범주 아래 주석 `← …` 는 그 범주를 쓰는 references 파일이다(검토용).

schema = 1
pack = "luau-kb"
roots = ["luau", "roblox"]

[defaults]
review_days = 90

